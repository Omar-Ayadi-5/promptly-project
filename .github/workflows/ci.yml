name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/assets/backend/requirements*.txt
      - run: python -m pip install -r src/assets/backend/requirements.txt
      - run: python -B -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/check_secrets.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/assets/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/assets/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
      - name: Browser integration checks
        run: |
          npm run dev -- --host localhost > /tmp/promptly-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
